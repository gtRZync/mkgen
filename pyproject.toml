[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=75.0", "wheel"]

[project]
authors = [
  {name = "Myson Dio"},
]
dependencies = [
  "rich>=14.2",
  "jinja2>=3.1",
]
description = "A C/C++ makefile generator"
license = "MIT"
name = "mkgen"
readme = "README.md"
requires-python = ">=3.11"
version = "0.6.0"

[project.urls]
Documentation = "https://github.com/gtRZync/mkgen"
Homepage = "https://github.com/gtRZync"

[project.scripts]
mkgen = "makefile_generator.cli.main:main"

[tools.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
mkgen = ["templates/**/*"]
